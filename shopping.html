<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Game Shop</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Videogameshopicon.png" />
  </head>

  <body>
    <section class="hero">
      <div class="hero-header">
        <h1>Youssef's Video Game Shop</h1>
        <p>
          Browse a vast selection of video game items from any game genre you
          can possibly think of
        </p>
      </div>
    </section>

    <h1 class="section-title">Browse Products</h1>

    <section class="filters">
      <button onclick="filterProducts('All')">All</button>
      <button onclick="filterProducts('Horror')">Horror</button>
      <button onclick="filterProducts('Shooter')">Shooter</button>
      <button onclick="filterProducts('Sandbox')">Sandbox</button>
      <button onclick="filterProducts('Action')">Action</button>
      <button onclick="filterProducts('Platformer')">Platformer</button>
      <button onclick="filterProducts('Mobile')">Mobile</button>
      <button onclick="filterProducts('Puzzle')">Puzzle</button>
      <button onclick="filterProducts('Mystery')">Mystery</button>
      <button onclick="filterProducts('Racing')">Racing</button>
      <button onclick="filterProducts('Strategy')">Strategy</button>
      <button onclick="filterProducts('Survival')">Survival</button>
      <button onclick="filterProducts('Fighting')">Fighting</button>
    </section>

    <section class="container"></section>

    <section class="shopping-cart"></section>

    <section class="discount-section">
      <h2>Discount Code</h2>
      <input type="text" id="discount-code" placeholder="Enter code" />
      <button onclick="applyDiscount()">Apply Code</button>
      <p id="discount-message"></p>
      <button onclick="checkout()">Checkout</button>
    </section>
    <div class="popup"></div>
    <script src="shoppingcart.js"></script>
  </body>
</html>
